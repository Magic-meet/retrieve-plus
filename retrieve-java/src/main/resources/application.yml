server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:retrieve_new}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Vn776634}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: spring
      auto-offset-reset: earliest
    producer:
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

fastdfs:
  tracker-servers: ${FASTDFS_TRACKER_SERVERS:fastdfs:22122}

grpc:
  client:
    word2VectorService:
      address: static://${GRPC_WORD2VEC_HOST:retrieve-python-rpc}:${GRPC_WORD2VEC_PORT:50051}
      negotiation-type: plaintext
